requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "scikit-learn>=1.4,<2.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
]

[tool.uv]
package = false
